<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" fill="none">
<title>Hisyam Khaeru Umam — Software Developer</title>
<style>
.fade{opacity:0;animation:rise .85s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.10s}.d2{animation-delay:.24s}.d3{animation-delay:.38s}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.sw1{animation:s1 11s linear infinite}
.sw2{animation:s2 19s linear infinite;animation-delay:-7s}
@keyframes s1{from{transform:translateX(-780px) skewX(-14deg)}
              to{transform:translateX(1380px) skewX(-14deg)}}
@keyframes s2{from{transform:translateX(1380px) skewX(-14deg)}
              to{transform:translateX(-780px) skewX(-14deg)}}
.ping{transform-box:fill-box;transform-origin:center;
      animation:ping 2.8s cubic-bezier(.2,.7,.4,1) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.55}
                70%{transform:scale(3.4);opacity:0}
                100%{transform:scale(3.4);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .sw1,.sw2,.ping{animation:none}
  .fade{opacity:1;animation:none;transform:none}
}
</style>
<defs>
  <pattern id="dotsl" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r="1.2" fill="#0B0B0C"/>
  </pattern>
  <radialGradient id="vigl" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#FFF"/>
    <stop offset="0.42" stop-color="#FFF"/>
    <stop offset="1" stop-color="#000"/>
  </radialGradient>
  <linearGradient id="swgl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0B0B0C" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#0B0B0C" stop-opacity="1"/>
    <stop offset="1" stop-color="#0B0B0C" stop-opacity="0"/>
  </linearGradient>
  <mask id="vigml"><rect width="1200" height="300" fill="url(#vigl)"/></mask>
  <mask id="dotml"><rect width="1200" height="300" fill="url(#dotsl)"/></mask>
  <clipPath id="roundl"><rect width="1200" height="300" rx="16"/></clipPath>
</defs>
<rect width="1200" height="300" rx="16" fill="#FCFCFC"/>
<g clip-path="url(#roundl)">
  <g mask="url(#vigml)">
    <rect width="1200" height="300" fill="url(#dotsl)" opacity="0.13"/>
    <g mask="url(#dotml)">
      <rect class="sw1" x="0" y="-160" width="380" height="620" fill="url(#swgl)" opacity="0.62"/>
      <rect class="sw2" x="0" y="-160" width="240" height="620" fill="url(#swgl)" opacity="0.31"/>
    </g>
  </g>
</g>
<g class="fade d1"><circle class="ping" cx="481.1" cy="86.0" r="3.5" fill="#1A7F37"/><circle cx="481.1" cy="86.0" r="3.5" fill="#1A7F37"/><text x="494.6" y="90.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#6B6B73" letter-spacing="1.6">AVAILABLE FOR COLLABORATION</text></g>
<text class="fade d2" x="600.0" y="172" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="62"
      font-weight="700" fill="#0B0B0C" letter-spacing="-1.8">Hisyam Khaeru Umam</text>
<text class="fade d3" x="600.0" y="216" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="18"
      font-weight="400" fill="#6B6B73" letter-spacing="0.2">Software Developer  ·  Flutter, Dart &amp; Supabase</text>
<rect x="0.5" y="0.5" width="1199" height="299" rx="15.5" fill="none"
      stroke="#0B0B0C" stroke-opacity="0.11"/>
</svg>