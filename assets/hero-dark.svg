<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" fill="none">
<title>Hisyam Khaeru Umam — Software Developer</title>
<style>
.fade{opacity:0;animation:rise .85s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.10s}.d2{animation-delay:.26s}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.sw1{animation:s1 11s linear infinite}
.sw2{animation:s2 19s linear infinite;animation-delay:-7s}
@keyframes s1{from{transform:translateX(-780px) skewX(-14deg)}
              to{transform:translateX(1380px) skewX(-14deg)}}
@keyframes s2{from{transform:translateX(1380px) skewX(-14deg)}
              to{transform:translateX(-780px) skewX(-14deg)}}
@media (prefers-reduced-motion:reduce){
  .sw1,.sw2{animation:none}
  .fade{opacity:1;animation:none;transform:none}
}
</style>
<defs>
  <pattern id="dotsd" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF"/>
  </pattern>
  <radialGradient id="vigd" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#FFF"/>
    <stop offset="0.42" stop-color="#FFF"/>
    <stop offset="1" stop-color="#000"/>
  </radialGradient>
  <linearGradient id="swgd" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <mask id="vigmd"><rect width="1200" height="240" fill="url(#vigd)"/></mask>
  <mask id="dotmd"><rect width="1200" height="240" fill="url(#dotsd)"/></mask>
  <clipPath id="roundd"><rect width="1200" height="240" rx="16"/></clipPath>
</defs>
<rect width="1200" height="240" rx="16" fill="#0B0B0C"/>
<g clip-path="url(#roundd)">
  <g mask="url(#vigmd)">
    <rect width="1200" height="240" fill="url(#dotsd)" opacity="0.13"/>
    <g mask="url(#dotmd)">
      <rect class="sw1" x="0" y="-160" width="380" height="620" fill="url(#swgd)" opacity="0.95"/>
      <rect class="sw2" x="0" y="-160" width="240" height="620" fill="url(#swgd)" opacity="0.47"/>
    </g>
  </g>
</g>
<text class="fade d1" x="600.0" y="122" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif"
      font-size="62" font-weight="700" fill="#FAFAFA" letter-spacing="-1.8">Hisyam Khaeru Umam</text>
<text class="fade d2" x="600.0" y="162" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="18"
      font-weight="400" fill="#8E8E96" letter-spacing="0.2">Developer</text>
<rect x="0.5" y="0.5" width="1199" height="239" rx="15.5" fill="none"
      stroke="#FFFFFF" stroke-opacity="0.09"/>
</svg>